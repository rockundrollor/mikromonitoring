global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    monitor: home

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
        labels:
          host: monitoring

  - job_name: vps-node
    static_configs:
      - targets: ['1.2.3.4:1111']
        labels:
          host: vps

  - job_name: icmp
    metrics_path: /probe
    scrape_interval: 15s
    params:
      module: [icmp]
    static_configs:
      - targets:
          - 1.1.1.1
          - 8.8.8.8
          # Add ther targets here
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: tcp
    metrics_path: /probe
    scrape_interval: 30s
    params:
      module: [tcp_connect]
    static_configs:
      - targets:
          - 1.2.3.4:443
          # Add targets here
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ['pushgateway:9091']

  - job_name: mikrotik
    scrape_interval: 60s
    scrape_timeout: 30s
    static_configs:
      - targets: ['mktxp:49090']

  - job_name: blackbox
    static_configs:
      - targets: ['blackbox:9115']
